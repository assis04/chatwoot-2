name: Chatcenter image

# Builda a imagem custom do Chatwoot (edição EE) nos runners do GitHub (~7GB RAM)
# em vez do VPS de produção (3.8GB, que estoura OOM e mata o sidekiq/web durante
# o build de assets). Publica em ghcr.io/assis04/chatwoot:<short-sha>; o VPS só
# faz `docker pull`. Ver a memória chatcenter-infra-constraints / chatwoot-fork-deploy.

on:
  push:
    branches:
      - 'upgrade/**'
  workflow_dispatch:

concurrency:
  group: chatcenter-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Fork Valcenter: build em Community Edition. Removemos o overlay enterprise
      # do contexto ANTES do build — a imagem não embarca nenhum código EE
      # (custom_roles foi reimplementado na base), e some o conflito de constante
      # no Zeitwerk. Ver a reconstrução do custom_roles em Community.
      - name: Community Edition (remove overlay enterprise)
        run: rm -rf enterprise

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/assis04/chatwoot:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/assis04/chatwoot:${{ steps.vars.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
